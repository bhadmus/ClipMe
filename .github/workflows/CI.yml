name: CI

on: [push, pull_request]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer

jobs:
  test:
    # branch protection requires the "test" status check; keep this name in sync
    name: test
    runs-on: macos-26
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Cache Swift packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .spm-cache
        key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          spm-${{ runner.os }}-

    - name: Run tests
      run: |
        xcodebuild \
          CODE_SIGN_IDENTITY=- \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          -scheme ClipMe \
          -project ClipMe.xcodeproj \
          -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/.spm-cache/SourcePackages" \
          -packageCachePath "$GITHUB_WORKSPACE/.spm-cache/PackageCache" \
          -skipPackagePluginValidation \
          -skipMacroValidation \
          clean test

    - name: Verify universal build
      run: |
        xcodebuild \
          CODE_SIGN_IDENTITY=- \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          ONLY_ACTIVE_ARCH=NO \
          -scheme ClipMe \
          -project ClipMe.xcodeproj \
          -configuration Release \
          -derivedDataPath "$GITHUB_WORKSPACE/build" \
          -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/.spm-cache/SourcePackages" \
          -packageCachePath "$GITHUB_WORKSPACE/.spm-cache/PackageCache" \
          -skipPackagePluginValidation \
          -skipMacroValidation \
          clean build

        binary="$GITHUB_WORKSPACE/build/Build/Products/Release/ClipMe.app/Contents/MacOS/ClipMe"
        # Require both slices so ClipMe runs natively on Apple silicon and Intel.
        if ! lipo "$binary" -verify_arch arm64 x86_64; then
          echo "::error::ClipMe binary is not universal; expected both arm64 and x86_64 slices." >&2
          lipo -archs "$binary" >&2
          exit 1
        fi
        echo "Verified universal binary: $(lipo -archs "$binary")"
